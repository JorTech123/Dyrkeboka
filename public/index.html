<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dyrkeboka – Tveitan</title>
<meta name="description" content="Dyrkeverktøy for småbruket ved Frebergsvik: såkalender, drivhus, kirsebærhage, bedplan og dagbok.">
<meta name="theme-color" content="#1d4630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dyrkeboka">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: varm og praktisk, som en godt brukt dyrkebok på et småbruk ved fjorden
IDEA: dyrkeboka og frøposen – et årshjul og en plantekalender for akkurat denne gården
PICTURE: Årshjulet – året som ring med frostfri sesong, drivhus, forkultivering og kirsebær, og en viser for i dag
COLOUR and TYPE: dyp skoggrønn, kirsebærrød aksent, hvete og glass som støtte; Fraunces til titler, Figtree til tekst
LAYOUT: grønt toppbånd, faner nederst på mobil og øverst på store skjermer, én kolonne som blir to på bred skjerm
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1712);--ink:light-dark(#15241b,#e6eee8);--mut:light-dark(#536659,#9db0a3);
--line:light-dark(#dfe7e0,#25352b);--card:light-dark(#f2f6f1,#152119);--card2:light-dark(#ffffff,#1a2a20);
--band:light-dark(#1d4630,#122a1d);--leaf:light-dark(#358446,#62b273);--cherry:light-dark(#b3172f,#ef6177);
--wheat:light-dark(#c4861c,#e2aa48);--glass:light-dark(#2b7a94,#5db3cc);--frost:light-dark(#e6edf2,#1d2a33);
--ring:light-dark(#edf2ec,#1b2a21)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.08;text-wrap:balance;margin:0;font-weight:700}
h2{font-size:clamp(30px,6vw,44px)}h3{font-size:21px;font-weight:600}
p{margin:0}
a{color:var(--glass)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.top{background:var(--band);color:#f4f8f2;padding:calc(10px + env(safe-area-inset-top)) max(4vw,16px) 12px;position:relative}
.tw{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1}
.brand h1{font-size:28px;color:#fff}
.brand p{font-size:14px;opacity:.85}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--band);border-top:1px solid rgba(255,255,255,.12);padding-bottom:env(safe-area-inset-bottom)}
nav#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:rgba(244,248,242,.72);text-decoration:none;font-size:13px;font-weight:600;min-height:58px;white-space:nowrap;overflow:hidden}
nav#nav a svg{width:24px;height:24px}
nav#nav a[aria-current=page]{color:#fff;box-shadow:inset 0 3px 0 var(--cherry)}
main{box-sizing:content-box;max-width:1180px;margin:0 auto;padding:22px max(4vw,16px) 40px}
.hero{display:grid;gap:20px;margin-bottom:22px}
.lead{color:var(--mut);font-size:16px;margin-top:8px}
.grid2{display:grid;gap:18px}
.card{background:var(--card);border-radius:18px;padding:18px}
.card.w{background:var(--card2);border:1px solid var(--line)}
.card h3{margin-bottom:10px}
.sec{margin-top:30px}
.sec>h3{margin-bottom:12px}
.muted{color:var(--mut)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.p{background:var(--band);color:#fff;border-color:transparent}
.btn.c{background:var(--cherry);color:#fff;border-color:transparent}
.btn.s{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
input[type=text],input[type=number],input[type=date],select,textarea{min-height:44px;font-size:16px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--mut)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--band);color:#fff;border-color:transparent}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ring);color:var(--mut);white-space:nowrap}
.tag.dh{background:color-mix(in srgb,var(--glass) 18%,transparent);color:var(--glass)}
.tag.kir{background:color-mix(in srgb,var(--cherry) 15%,transparent);color:var(--cherry)}
.tag.a{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:var(--leaf)}
.tag.v{background:color-mix(in srgb,var(--wheat) 18%,transparent);color:var(--wheat)}
/* årshjul */
.wheel{display:grid;gap:14px;align-items:center}
.wheel svg{width:100%;max-width:340px;height:auto;margin:0 auto;display:block}
.legend{display:grid;gap:8px;font-size:14px}
.legend span{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
@media (prefers-reduced-motion:no-preference){.needle{transition:transform .9s cubic-bezier(.2,.8,.2,1)}}
/* oppgaver */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tasks li{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:0}
.tasks input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--leaf);flex:none}
.tasks label{flex:1;cursor:pointer;display:grid;gap:3px}
.tasks li.done label{opacity:.5;text-decoration:line-through}
/* kalender */
.gantt{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card2)}
.gh,.gr{display:grid;grid-template-columns:132px minmax(0,1fr) 44px;align-items:center}
.gh{background:var(--card);font-size:13px;font-weight:700;color:var(--mut);position:sticky;top:0;z-index:2}
.gh .ms{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));text-align:center;padding:6px 0}
.gr{border-top:1px solid var(--line);min-height:44px}
.gr .nm{padding:6px 8px 6px 12px;font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;background:none;border:0;text-align:left;min-height:44px}
.gr .nm small{display:block;font-weight:500;color:var(--mut);font-size:13px}
.trk{position:relative;height:34px;margin:0 2px;background:linear-gradient(90deg,var(--frost) var(--lf),transparent var(--lf),transparent var(--ff),var(--frost) var(--ff))}
.trk .b{position:absolute;height:6px;border-radius:3px}
.b.i{top:3px;background:var(--wheat)}.b.u{top:11px;background:var(--leaf)}.b.pl{top:19px;background:var(--glass)}.b.h{top:27px;background:var(--cherry)}
.trk .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.star{width:44px;height:44px;border:0;background:none;cursor:pointer;color:var(--mut);display:grid;place-items:center}
.star[aria-pressed=true]{color:var(--wheat)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:12px 0}
.lg i{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
@media(max-width:520px){.gh,.gr{grid-template-columns:104px minmax(0,1fr) 40px}.gr .nm{font-size:14px;padding-left:10px}.gr .nm small{display:none}.gh .ms{font-size:13px}}
/* bed */
.beds{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.bed{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card2);display:grid;gap:10px}
.bed header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bed h4{margin:0;font-size:18px;font-family:Fraunces,Georgia,serif}
.warn{font-size:14px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--cherry) 10%,transparent);color:var(--ink);border-left:3px solid var(--cherry)}
.okn{font-size:14px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--leaf) 12%,transparent);border-left:3px solid var(--leaf)}
.rot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;font-weight:600}
.rot b{padding:6px 12px;border-radius:999px;color:#fff}
.g1{background:#9a5b2a}.g2{background:#358446}.g3{background:#2b6c8a}.g4{background:#b5761a}
.cx{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600}
.cx button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--mut);font-size:17px;line-height:1}
/* kirsebær */
.orch{display:grid;gap:6px;overflow-x:auto;padding:4px 2px}
.orow{display:grid;grid-template-columns:52px repeat(var(--c),minmax(34px,1fr));gap:6px;align-items:center}
@media(max-width:520px){.orow{grid-template-columns:20px repeat(var(--c),minmax(28px,1fr));gap:4px}.orow .rt{display:none}.tree{min-height:28px}}
.orow .rl{font-size:13px;color:var(--mut);font-weight:700}
.tree{aspect-ratio:1;min-height:34px;padding:0;border-radius:50%;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;position:relative;background:var(--tc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tree.none{background:transparent;border:2px dashed var(--mut);color:var(--mut);box-shadow:none}
.tree .st{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.1}
.kpi span{font-size:14px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut)}
.pests{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.pests .card h4{margin:0 0 6px;font-size:17px}
.months{display:grid;gap:0}
.months>div{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.months>div.cur{background:color-mix(in srgb,var(--wheat) 12%,transparent);border-radius:10px;padding-left:8px}
.months b{font-family:Fraunces,Georgia,serif}
/* logg */
.bars{display:grid;gap:8px}
.bars .br{display:grid;grid-template-columns:120px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:15px}
.bars .bt{height:14px;border-radius:7px;background:var(--ring);overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--cherry);border-radius:7px}
.bars .br span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.logl{list-style:none;padding:0;margin:0}
.logl li{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.logl .d{font-weight:700;font-size:14px;color:var(--mut);white-space:nowrap}
.del{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--mut)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,15,9,.5)}
.panel{position:relative;background:var(--bg);width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.panel h3{font-size:26px}
.panel .x{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:22px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px;margin:12px 0}
.dl dt{color:var(--mut);font-weight:600}.dl dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw;font-size:15px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--wheat);font-weight:700;min-height:36px;cursor:pointer}
.panel h4{margin:18px 0 8px;font:700 16px Figtree,system-ui,sans-serif}
details summary{padding:6px 0}
.wx{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(76px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.wd{display:grid;justify-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);text-align:center}
.wd b{font-size:18px}
.wd span{white-space:nowrap}
.farm svg{width:100%;max-width:640px;height:auto;display:block;border-radius:14px}
.farm a{cursor:pointer}
.ask textarea{min-height:64px}
.answer{white-space:pre-wrap;font-size:15px;margin-top:12px;line-height:1.6}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
@media(min-width:760px){
 body{padding-bottom:0}
 .top{padding-bottom:0}
 .tw{padding-bottom:8px}
 nav#nav{position:static;max-width:1180px;margin:0 auto;display:flex;gap:4px;background:none;border:0;padding:0}
 nav#nav a{flex-direction:row;gap:8px;padding:12px 16px;min-height:48px;font-size:15px;border-radius:12px 12px 0 0}
 nav#nav a svg{width:20px;height:20px}
 nav#nav a[aria-current=page]{background:var(--bg);color:var(--ink);box-shadow:none}
 .hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
 .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .wheel{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
 .sheet{align-items:center}
 .panel{border-radius:22px}
 .toast{bottom:24px}
}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}.stack td::before{content:attr(data-l);color:var(--mut);font-weight:600;font-size:13px}.bars .br{grid-template-columns:96px minmax(0,1fr) 64px}}
</style>
</head>
<body>
<header class="top">
 <div class="tw">
  <div class="brand"><h1 id="farmName">Tveitan</h1><p id="farmSub">Dyrkeboka · Frebergsvik, Nykirke</p></div>
  <button id="btnSet" class="iconbtn" aria-label="Oppsett" data-act="settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
 <nav id="nav" aria-label="Faner">
  <a href="#idag" data-tab="idag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>I dag</span></a>
  <a href="#kalender" data-tab="kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Kalender</span></a>
  <a href="#hagen" data-tab="hagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V11"/><path d="M12 11c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 6.5 7 5.5z"/><path d="M5 21h14"/></svg><span>Hagen</span></a>
  <a href="#drivhus" data-tab="drivhus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21V10l9-6 9 6v11z"/><path d="M12 4v17M3 14h18"/></svg><span>Drivhus</span></a>
  <a href="#kirsebaer" data-tab="kirsebaer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="17" r="4"/><circle cx="17" cy="16" r="4"/><path d="M7 13c1-5 4-8 8-10M17 12c-1-4-1-7-2-9M15 3c2 0 4 1 5 3"/></svg><span>Kirsebær</span></a>
  <a href="#logg" data-tab="logg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 17a2 2 0 0 1 2-2h12M9 7h6M9 11h4"/></svg><span>Logg</span></a>
 </nav>
</header>
<main id="app"></main>
<div id="sheet" class="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="shT"><button class="x" data-act="close" aria-label="Lukk">×</button><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
{
// ---------- Vekstdatabase: uker er tilpasset kyst-Vestfold (siste vårfrost ca. 15. mai = uke 20) ----------
// i = så inne / forkultiver, u = så direkte ute, pl = plant ut / sett, h = høst (eller blomstring)
// r: vekstskiftegruppe 1 potet/fruktgrønnsaker, 2 belgvekster, 3 kålvekster, 4 rot og løk, 0 fleksibel, 9 flerårig
const FAM={kal:'Korsblomstfamilien (kål)',lok:'Løkfamilien',skj:'Skjermplantefamilien',sol:'Søtvierfamilien',gre:'Gresskarfamilien',bel:'Erteblomstfamilien (belgvekster)',kur:'Kurvplantefamilien',mel:'Amarantfamilien (bete, spinat)',gra:'Grasfamilien',lep:'Leppeblomstfamilien',ros:'Rosefamilien',ann:'Annen familie'};
const GRP={1:'Potet og fruktgrønnsaker',2:'Belgvekster',3:'Kålvekster',4:'Rot og løk',0:'Fleksibel',9:'Flerårig – fast plass'};

{id:'mangold',n:'Mangold',l:'Beta vulgaris var. cicla',c:'g',f:'mel',r:4,i:[[14,16]],u:[[18,26]],pl:[[19,22]],h:[[26,44]],sd:'2 cm',av:'25 × 40 cm',sp:'1–2 uker',dg:'50–60 dager',v:['lok'],x:[],tip:'Høst de ytre bladene løpende – planten gir hele sommeren og tåler lett frost.'},

{id:'agurk',n:'Slangeagurk',l:'Cucumis sativus',c:'d',f:'gre',r:1,t:1,dh:1,i:[[14,17]],pl:[[19,22]],h:[[27,38]],lab:{pl:'Plant i drivhus'},sd:'1 cm',av:'60 × 100 cm, opp på hyssing',sp:'3–5 dager, 20–25 °C',dg:'50–70 dager',v:['dill','buskbonne','erter'],x:['potet'],tip:'Vil ha varme og fuktig luft – spinnmidd elsker tørr varme. Moderne F1-sorter har bare hunnblomster og trenger ingen pollinering. Høst ofte.'},

 try{
  while(outbox.length){const o=outbox[0];await api('/logg/'+encodeURIComponent(o.id),o.op==='put'?{method:'PUT',body:o.e}:{method:'DELETE'});outbox.shift();lsSet(LSOUT,outbox)}
  const first=!lsGet(LSLINK),r=await api('/state');
  if(r&&(first||r.t>(S.t||0))){if(first&&S.t)lsSet('dyrkeboka-lokal-kopi',{S,L});S=normalize(JSON.parse(r.data));S.t=r.t;lsSet(LSK,S);changed=true}
  else if(!r||(S.t||0)>r.t){if(!S.t)S.t=Date.now();const p=await api('/state',{method:'PUT',body:{data:JSON.stringify(S),t:S.t}});

function sun(d){const rad=Math.PI/180,n=doy(d),g=2*Math.PI/365*(n-1);

function bedWarnings(b){const out=[],seen=new Set(),list=(b.h[planYear]||[]).map(id=>byId[id]).filter(Boolean);
 list.forEach(c=>{if(c.r===9||['ann','lep','ros'].includes(c.f)||seen.has(c.f))return;const lb=LOOK[c.f]||2;
  for(let k=1;k<=lb;k++){const prev=(b.h[planYear-k]||[]).map(id=>byId[id]).filter(p=>p&&p.f===c.f);
   if(prev.length){seen.add(c.f);out.push(`<b>${FAM[c.f]}</b> sto her i ${planYear-k} (${prev.map(p=>esc(p.n)).join(', ')}). ${c.f==='kal'?'Vent helst fire år mellom kålvekster på samme sted på grunn av kålbrok.':`Vent ${lb} år om du kan.`}${b.zone==='dh'?' I drivhuset: bytt side, forny jorda eller dyrk i sekker.':''}`);break}}});
 for(let a=0;a<list.length;a++)for(let z=a+1;z<list.length;z++){const A=list[a],B=list[z];if((A.x||[]).includes(B.id)||(B.x||[]).includes(A.id))out.push(`${esc(A.n)} og ${esc(B.n)} er dårlige naboer – sett dem i hvert sitt bed.`)}

function treeCol(t){if(t.st==='ikke')return'none';if(treeColor==='st')return STAT[t.st][1];const s=sortById[t.sort];return s?s.col:'#b5b5b5'}
function polCheck(){const alive=S.trees.filter(t=>t.st!=='ikke'&&t.st!=='dod');if(!alive.length)return`<p class="muted">Ingen levende trær registrert.</p>`;
 const present=[...new Set(alive.filter(t=>(sortById[t.sort]||{}).t==='søt').map(t=>t.sort))],out=[];
 present.forEach(id=>{const s=sortById[id];if(s.sf!=='nei')return;
  const ok=present.some(o=>o!==id&&!(s.no||[]).includes(o)&&(sortById[o].sf==='ja'||(s.pw||[]).includes(o)));
  out.push(ok?`<div class="okn"><b>${s.n}</b> har en pollinator i hagen.</div>`:`<div class="warn"><b>${s.n}</b> mangler pollinator. Plant f.eks. ${((s.pw&&s.pw.length?s.pw:['stella','lapins']).filter(x=>sortById[x]&&!(s.no||[]).includes(x)).map(x=>sortById[x].n)).join(' eller ')} i nærheten – de må blomstre samtidig.</div>`)});
 const sf=present.filter(id=>sortById[id].sf==='ja');
 if(sf.length)out.push(`<div class="okn">Selvfertile søtkirsebær: ${sf.map(id=>sortById[id].n).join(', ')}. De pollinerer seg selv og kan pollinere de fleste andre søtkirsebær som blomstrer samtidig.</div>`);
 const unk=alive.filter(t=>t.sort==='ukjent').length;
 if(unk)out.push(`<div class="warn">${unk} av ${alive.length} trær har ukjent sort. Registrer sortene for å sjekke pollineringen – søtkirsebær som ikke er selvfertile gir lite bær uten en passende nabo.</div>`);
 if(!out.length)out.push(`<p class="muted">Ingen søtkirsebær registrert. Surkirsebær er stort sett selvfertile.</p>`);
 return out.join('')}
function rKirsebaer(){const n=S.trees.length,cnt=k=>S.trees.filter(t=>t.st===k).length,hk=S.trees.reduce((s,t)=>s+num(t.h[YEAR]),0),m=TODAY.getMonth()+1;
 let rows='';for(let r=0;r<S.rows;r++){rows+=`<div class="orow" style="--c:${S.cols}"><span class="rl"><span class="rt">Rad </span>${r+1}</span>`;for(let c=0;c<S.cols;c++){const i=r*S.cols+c,t=S.trees[i];if(!t)continue;const col=treeCol(t),s=sortById[t.sort]||{n:t.sort};

 const used=treeColor==='sort'?[...new Set(S.trees.map(t=>t.sort))].map(id=>sortById[id]||{id,n:id,col:'#b5b5b5'}):Object.keys(STAT).map(k=>({n:STAT[k][0],col:STAT[k][1]}));
 const leg=used.map(s=>`<span class="cx" style="padding-right:12px"><i style="display:inline-block;width:14px;height:14px;border-radius:50%;${s.col==='none'?'border:2px dashed var(--mut)':'background:'+s.col}"></i>${esc(s.n)} ${treeColor==='sort'?`<span class="muted">${S.trees.filter(t=>t.sort===s.id).length}</span>`:''}</span>`).join('');

 <p class="small muted" style="margin-top:10px">Selvfertile søtkirsebær kan pollinere de fleste andre sorter som blomstrer samtidig. Sjekk alltid med planteskolen for sorten du kjøper.</p></section>

function harvestBars(){const sums={};L.filter(e=>e.ty==='Høstet'&&String(e.d).startsWith(String(logYear))&&(e.u==='kg'||e.u==='g')).forEach(e=>{const k=e.cr&&byId[e.cr]?byId[e.cr].n:'Annet';sums[k]=(sums[k]||0)+num(e.q)*(e.u==='g'?.001:1)});
 const tk=S.trees.reduce((s,t)=>s+num(t.h[logYear]),0);if(tk)sums['Kirsebær (trærne)']=(sums['Kirsebær (trærne)']||0)+tk;
 const arr=Object.entries(sums).sort((a,b)=>b[1]-a[1]);if(!arr.length)return`<p class="muted">Ingen høst registrert i ${logYear}. Velg «Høstet» og enheten kg eller g når du skriver i loggen.</p>`;
 const mx=arr[0][1]||1,tot=arr.reduce((s,a)=>s+a[1],0);
 return`<p style="margin-bottom:10px"><b style="font-family:Fraunces,Georgia,serif;font-size:30px">${nf(tot)} kg</b> <span class="muted">totalt</span></p><div class="bars">${arr.map(([k,v])=>`<div class="br"><span>${esc(k)}</span><span class="bt"><i style="width:${(v/mx*100).toFixed(1)}%"></i></span><span>${nf(v)} kg</span></div>`).join('')}</div>`}
function rLogg(){const years=[...new Set([YEAR].concat(L.map(e=>+String(e.d).slice(0,4)).filter(Boolean)))].sort((a,b)=>b-a);
 const list=L.filter(e=>String(e.d).startsWith(String(logYear))&&(!logType||e.ty===logType)).sort((a,b)=>String(b.d).localeCompare(String(a.d)));
 const counts={};L.filter(e=>String(e.d).startsWith(String(logYear))).forEach(e=>counts[e.ty]=(counts[e.ty]||0)+1);
 let lastM='',items='';list.forEach(e=>{const d=new Date(e.d+'T12:00');const mk=MONL[d.getMonth()]+' '+d.getFullYear();if(mk!==lastM){items+=`<li style="display:block;border:0;padding:16px 0 4px"><b>${cap(mk)}</b></li>`;lastM=mk}
  items+=`<li><span class="d">${fmt(d)}</span><span><b>${esc(e.ty)}</b>${e.cr&&byId[e.cr]?' · '+esc(byId[e.cr].n):''}${e.q?` · ${esc(e.q)} ${esc(e.u)}`:''}${e.pl?` · <span class="muted">${esc(e.pl)}</span>`:''}${e.n?`<br><span class="muted">${esc(e.n)}</span>`:''}</span><button class="del" data-dellog="${esc(e.id)}" aria-label="Slett notatet">×</button></li>`});
 return`<h2>Dagboka</h2><p class="lead">Skriv ned det dere gjør og høster. Neste års plan blir bedre av det.</p>
 <form id="logF" class="card w fg" style="margin-top:16px">
 <label class="f">Dato<input type="date" name="d" value="${isoDay(TODAY)}" required></label>
 <label class="f">Hva<select name="ty">${LT.map(t=>`<option ${t===logDraft.type?'selected':''}>${t}</option>`).join('')}</select></label>

 <div style="grid-column:1/-1"><button class="btn p" type="submit">Lagre i loggen</button></div></form>
 <section class="sec grid2"><div class="card"><h3>Høstet i ${logYear}</h3>${harvestBars()}</div>
  <div class="card"><h3>Året i tall</h3>${Object.keys(counts).length?`<div class="bars">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="br"><span>${esc(k)}</span><span class="bt"><i style="width:${(v/Math.max(...Object.values(counts))*100).toFixed(1)}%;background:var(--leaf)"></i></span><span>${v}</span></div>`).join('')}</div>`:'<p class="muted">Ingen notater dette året ennå.</p>'}</div></section>
 <section class="sec"><div class="row" style="justify-content:space-between"><h3>Notater</h3><div class="row"><select id="logYear" aria-label="År" style="width:auto">${years.map(y=>`<option ${y===logYear?'selected':''}>${y}</option>`).join('')}</select><select id="logType" aria-label="Type" style="width:auto"><option value="">Alle typer</option>${LT.map(t=>`<option ${t===logType?'selected':''}>${t}</option>`).join('')}</select></div></div>

 if(d.act){const a=d.act;
  if(a==='close')closeSheet();

  else if(a==='addbed'||a==='adddhbed'){const dh=a==='adddhbed',n=S.beds.filter(b=>b.zone===(dh?'dh':'ute')).length+1;const b={id:'b'+Date.now().toString(36),name:dh?'Drivhusbed '+n:'Bed '+n,zone:dh?'dh':'ute',size:'',h:{}};S.beds.push(b);commit();openSheet(bedSheet(b.id))}
  else if(a==='copy'){const txt=backupTxt();const ta=$('#impT');
   (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Sikkerhetskopien er kopiert. Lim den inn i et notat eller en e-post til deg selv.')).catch(()=>{if(ta){ta.value=txt;ta.select()}toast('Kunne ikke kopiere automatisk – teksten er lagt i feltet, kopier den derfra.')})}
  else if(a==='download'){const u=URL.createObjectURL(new Blob([backupTxt()],{type:'application/json'})),x=document.createElement('a');x.href=u;x.download=`dyrkeboka-${isoDay(new Date())}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Sikkerhetskopien er lastet ned.')}
  else if(a==='syncnow'){sync().then(()=>{toast(srv.ok?'Synkronisert.':srv.msg);if(!$('#sheet').hidden)openSheet(setSheet())})}
  else if(a==='import'){const v=($('#impT')||{}).value||'';if(v.trim())doImport(v)}
  return}
 if(d.star!==undefined&&d.star){const id=d.star,i=S.mine.indexOf(id);if(i>=0)S.mine.splice(i,1);else S.mine.push(id);commit();if(d.re)openSheet(cropSheet(id));else if(tab==='kalender'){$('#ganttBox')&&($('#ganttBox').innerHTML=gantt(filterCrops()))}return}
 if(d.crop){openSheet(cropSheet(d.crop));return}
 if(d.tc){treeColor=d.tc;render();return}
 if(d.tree!==undefined&&d.tree!==''){openSheet(treeSheet(+d.tree));return}
 if(d.py){planYear=+d.py;render();return}
 if(d.rmcrop){const b=S.beds.find(x=>x.id===d.bed);if(!b)return;const snap=JSON.stringify(S);b.h[planYear]=(b.h[planYear]||[]).filter(x=>x!==d.rmcrop);commit();toast(`${byId[d.rmcrop].n} er fjernet fra ${b.name}.`,()=>{S=normalize(JSON.parse(snap));commit()});return}
 if(d.editbed){openSheet(bedSheet(d.editbed));return}
 if(d.delbed){const snap=JSON.stringify(S),b=S.beds.find(x=>x.id===d.delbed);S.beds=S.beds.filter(x=>x.id!==d.delbed);closeSheet();commit();toast(`${b?b.name:'Bedet'} er slettet.`,()=>{S=normalize(JSON.parse(snap));commit()});return}
 if(d.dellog){delLog(d.dellog);return}
 if(d.cat){calCat=d.cat;render();return}
 if(d.logcrop){logDraft.crop=d.logcrop;logDraft.type='Sådd inne';closeSheet();if(tab==='logg')render();else location.hash='logg';return}
 if(d.tobed){openSheet(bedPicker(d.tobed));return}
 if(d.addbed2){const b=S.beds.find(x=>x.id===d.addbed2);if(!b)return;const arr=b.h[planYear]=b.h[planYear]||[];if(!arr.includes(d.c))arr.push(d.c);closeSheet();commit();toast(`${byId[d.c].n} er lagt i ${b.name} (${planYear}).`);return}
 if(d.q){const t=$('#askQ');if(t)t.value=d.q;ask(d.q);return}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&el.dataset.task){if(el.checked)S.done[el.dataset.task]=1;else delete S.done[el.dataset.task];commit();return}
 if(el.dataset&&el.dataset.addcrop){const id=el.value;if(!id)return;const b=S.beds.find(x=>x.id===el.dataset.addcrop);if(!b)return;const arr=b.h[planYear]=b.h[planYear]||[];if(!arr.includes(id))arr.push(id);commit();return}
 if(el.id==='logYear'){logYear=+el.value;render();return}
 if(el.id==='logType'){logType=el.value;render();return}
 if(el.id==='impFile'&&el.files&&el.files[0]){el.files[0].text().then(doImport).catch(()=>toast('Kunne ikke lese filen.'));return}
});
document.addEventListener('input',e=>{if(e.target.id==='calQ'){calQ=e.target.value;const g=$('#ganttBox');if(g)g.innerHTML=gantt(filterCrops())}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const fd=new FormData(f),g=k=>(fd.get(k)??'').toString().trim();
 if(f.id==='logF'){const en={id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:g('d')||isoDay(TODAY),ty:g('ty'),cr:g('cr'),pl:g('pl'),q:g('q'),u:g('u'),n:g('n'),t:Date.now()};
  if(!en.cr&&!en.n&&!en.q){toast('Velg en vekst eller skriv et notat først.');return}
  logDraft={crop:'',type:en.ty};logYear=+en.d.slice(0,4)||YEAR;addLog(en);toast('Lagret i loggen.');return}
 if(f.id==='treeF'){const i=+f.dataset.i,t=S.trees[i];if(!t)return;t.sort=g('sort');t.st=g('st');t.yr=g('yr');t.gs=g('gs');t.note=g('note');const hk=g('hk');if(hk==='')delete t.h[YEAR];else t.h[YEAR]=num(hk);closeSheet();commit();toast(`Tre ${i+1} er lagret.`);return}
 if(f.id==='rowF'){const r=+g('r'),s=g('s');for(let c=0;c<S.cols;c++){const t=S.trees[r*S.cols+c];if(t)t.sort=s}commit();toast(`Rad ${r+1} er satt til ${sortById[s].n}.`);return}
 if(f.id==='setF'){const md=v=>{const m=/^\d{4}-(\d{2}-\d{2})$/.exec(v);return m?m[1]:null};S.name=g('name')||'Gården';S.place=g('place');S.lf=md(g('lf'))||S.lf;S.ff=md(g('ff'))||S.ff;
  const nr=Math.max(1,Math.min(20,parseInt(g('rows'))||S.rows)),nc=Math.max(1,Math.min(20,parseInt(g('cols'))||S.cols));
  if(nr*nc<S.trees.length&&!confirmShrink(nr*nc))return;S.rows=nr;S.cols=nc;resizeTrees(S);closeSheet();commit();toast('Oppsettet er lagret.');return}
 if(f.id==='bedF'){const b=S.beds.find(x=>x.id===f.dataset.id);if(!b)return;b.name=g('name')||b.name;b.size=g('size');b.zone=g('zone')==='dh'?'dh':'ute';closeSheet();commit();return}
 if(f.id==='keyF'){srv.key=g('k');lsSet(LSKEY,srv.key);srv.msg='';closeSheet();sync().then(()=>{toast(srv.ok?'Koblet til felles lagring.':(srv.msg||'Kunne ikke koble til.'));render()});return}
 if(f.id==='askF'){ask(($('#askQ')||{}).value||'');return}
});
let shrinkOk=0;function confirmShrink(n){if(shrinkOk===n)return true;shrinkOk=n;toast(`Det gir ${n} trær – de siste ${S.trees.length-n} trærne og dataene deres fjernes. Trykk Lagre igjen for å bekrefte.`);return false}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
window.addEventListener('hashchange',route);

// ---------- start ----------
route();
srvInit();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});

}
</script>
</body>
